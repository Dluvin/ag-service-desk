services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/prod.db
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-long-random-string}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      REVEAL_APP_ID: ${REVEAL_APP_ID:-}
      REVEAL_USERNAME: ${REVEAL_USERNAME:-}
      REVEAL_PASSWORD: ${REVEAL_PASSWORD:-}
      REVEAL_BASE_URL: ${REVEAL_BASE_URL:-https://fim.api.us.fleetmatics.com}
    volumes:
      - desk-data:/data

volumes:
  desk-data:
